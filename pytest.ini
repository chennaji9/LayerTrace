[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
python_files = test_*.py
addopts = -ra --strict-markers
markers =
    contract: 契约测试（JSON Schema / OpenAPI / Provider 契约）
    unit: 单元测试（领域规则，无外部依赖）
    integration: 集成测试（需要 PostgreSQL 测试库）
    scenario: 场景测试（回放/故障场景一致性）
    e2e: 浏览器验收（Playwright）
    security: 安全与授权边界测试
    performance: 性能实测（结果仅代表执行环境）
filterwarnings =
    error::DeprecationWarning:apps.*
