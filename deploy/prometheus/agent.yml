# 可选 Prometheus agent 配置模板，默认部署不加载，未作为实测交付能力。
# 使用前必须部署真实exporter和认证加密的remote-write接收端，核对CA及访问权限。
global:
  scrape_interval: 10s

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ['localhost:9100']
  - job_name: vm-probe
    static_configs:
      - targets: ['localhost:9108']

remote_write:
  - url: https://prometheus-write.layertrace.local/api/v1/write
    # TLS：受信 CA、主机名与有效期校验（明文与不可信证书连接被拒绝）
    tls_config:
      ca_file: /etc/layertrace/ca/prometheus-ca.crt
      server_name: prometheus-write.layertrace.local
    # 认证由入口侧令牌承担
    authorization:
      type: Bearer
      credentials_file: /etc/layertrace/secrets/remote-write-token
