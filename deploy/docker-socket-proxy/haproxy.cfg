# 受限 Docker 代理 HAProxy 配置：白名单路径，其余全部 403。
global
    log stdout format raw local0
    maxconn 32

defaults
    mode http
    timeout client 30s
    timeout server 30s
    timeout connect 5s

frontend docker_proxy
    bind *:2375
    default_backend deny_all

backend docker_api
    server docker /var/run/docker.sock

backend deny_all
    http-request deny status 403

# 白名单：容器列表/inspect/stats/events
frontend docker_proxy
    http-request allow if { path -i -m beg /containers/json }
    http-request allow if { path -i -m reg ^/containers/[^/]+/json$ }
    http-request allow if { path -i -m reg ^/containers/[^/]+/stats$ }
    http-request allow if { path -i -m beg /events }
    http-request allow if { path -i -m beg /info }
    http-request deny status 403
    default_backend docker_api
