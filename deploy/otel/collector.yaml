# OTel Collector（标准档可选组件）
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
  # 脱敏兜底：drop 含敏感键的 span 属性（SDK 侧已先行排除）
  attributes/privacy:
    actions:
      - action: delete
        key: prompt
      - action: delete
        key: task_id
      - action: delete
        key: trace_id

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: false

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [attributes/privacy, batch]
      exporters: [otlp/tempo]
