# Tempo（标准档可选链路后端；止损规则下的优先移除项）
server:
  http_listen_port: 3200
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
compactor:
  compaction:
    block_retention: ${TEMPO_RETENTION_PERIOD}
metrics_generator:
  registry:
    external_labels:
      source: tempo
