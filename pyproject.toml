[build-system]
requires = ["setuptools==72.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "layertrace"
version = "0.1.0"
description = "层迹 LayerTrace - 以虚拟机为边界、以故障事件为入口、以证据链为输出的跨层可观测诊断工作台"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "LayerTrace Project" }]
dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.30.6",
  "pydantic==2.9.2",
  "pydantic-settings==2.5.2",
  "SQLAlchemy[asyncio]==2.0.35",
  "asyncpg==0.29.0",
  "alembic==1.13.2",
  "Jinja2==3.1.4",
  "httpx==0.27.2",
  "click==8.1.7",
  "PyYAML==6.0.2",
  "jsonschema==4.23.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.3",
  "pytest-asyncio==0.24.0",
  "ruff==0.6.8",
  "mypy==1.11.2",
  "types-PyYAML==6.0.12.20240917",
  "psycopg[binary]==3.2.1",
]
e2e = [
  "playwright==1.48.0",
]

[project.scripts]
layertrace = "apps.control_plane.cli:main"

[tool.setuptools.packages.find]
include = [
  "apps*",
  "agents*",
  "packages*",
  "integrations*",
  "workloads*",
]

[tool.pytest.ini_options]
# 占位；正式配置在 pytest.ini 中维护（见 T009）
addopts = ""

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["apps/control_plane/web/static/vendor", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI stores these declarative dependency/parameter objects on the route.
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "apps.control_plane.auth.require_scope",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = ["apps/control_plane/web/static/vendor", "tests/e2e"]
